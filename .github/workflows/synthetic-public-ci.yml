name: Synthetic public site CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-public-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-branch-guard:
    name: Require main branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Synthetic public CI may only run from refs/heads/main." >&2
          exit 1
      - name: Confirm allowed ref
        if: github.ref == 'refs/heads/main'
        run: echo "Running from refs/heads/main."

  build:
    name: Generate and build synthetic site
    needs: main-branch-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_ARTIFACT_NAME: synthetic-public-site-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.upload_site.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_site.outputs.artifact-digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Generate synthetic fixtures
        run: >-
          python3 -B scripts/generate_synthetic_public_fixtures.py
          --output "$RUNNER_TEMP/dotchi-public-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Build public site
        run: >-
          python3 -B scripts/build_public_site.py
          --fixtures "$RUNNER_TEMP/dotchi-public-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output "$RUNNER_TEMP/dotchi-public-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Confirm artifact file count
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/dotchi-public-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          file_count="$(find "$site_dir" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          echo "Public artifact files: $file_count (expected 17)"
          test "$file_count" = "17"

      - name: Upload public artifact
        id: upload_site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/dotchi-public-site-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 3

      - name: Confirm artifact identity is available
        env:
          ARTIFACT_ID: ${{ steps.upload_site.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_site.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

  validate:
    name: Independently validate artifact
    needs:
      - main-branch-guard
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      tree_digest: ${{ steps.artifact_integrity.outputs.tree_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/dotchi-public-site-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate downloaded artifact
        run: >-
          python3 -B scripts/validate_public_artifact.py
          "$RUNNER_TEMP/dotchi-public-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Hash validated artifact tree
        id: artifact_integrity
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/dotchi-public-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tree_digest="$(cd "$site_dir" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]]
          echo "tree_digest=$tree_digest" >> "$GITHUB_OUTPUT"
          echo "Validated artifact tree SHA-256: $tree_digest"

  deploy:
    name: Deploy approved artifact to Cloudflare Pages staging
    needs:
      - main-branch-guard
      - build
      - validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: pages-staging
    env:
      WRANGLER_VERSION: '4.152.0'
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Confirm validated artifact identity
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact_digest }}
          VALIDATED_TREE_DIGEST: ${{ needs.validate.outputs.tree_digest }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VALIDATED_TREE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$ARTIFACT_ID" = "$BUILD_ARTIFACT_ID"
          test "$ARTIFACT_DIGEST" = "$BUILD_ARTIFACT_DIGEST"

      - name: Download validated artifact by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/dotchi-public-site-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compare deploy artifact with validated tree
        env:
          EXPECTED_TREE_DIGEST: ${{ needs.validate.outputs.tree_digest }}
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/dotchi-public-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -d "$site_dir"
          tree_digest="$(cd "$site_dir" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$tree_digest" = "$EXPECTED_TREE_DIGEST"
          echo "Deploy artifact matches validated tree SHA-256: $tree_digest"

      - name: Install pinned Wrangler
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-package-lock "wrangler@$WRANGLER_VERSION"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" --version

      - name: Check Cloudflare credentials are configured without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not available to this Environment job." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not available to this Environment job." >&2
            exit 1
          fi
          echo "Cloudflare credential variables are present; values are hidden."

      - name: Confirm existing staging project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          diagnostic_dir="$(mktemp -d "$RUNNER_TEMP/wrangler-project-list.XXXXXX")"
          stdout_file="$diagnostic_dir/stdout.txt"
          stderr_file="$diagnostic_dir/stderr.txt"
          trap 'rm -f "$stdout_file" "$stderr_file"; rmdir "$diagnostic_dir"' EXIT

          if CI=true "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages project list --json >"$stdout_file" 2>"$stderr_file"; then
            wrangler_status=0
          else
            wrangler_status=$?
          fi

          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          node scripts/diagnose_wrangler_project_list.mjs \
            --wrangler-exit-code "$wrangler_status" \
            --stdout-file "$stdout_file" \
            --stderr-file "$stderr_file" \
            --expected-project dotchi-ikebukuro-staging

      - name: Verify current main HEAD and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          latest_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo "Selected commit is no longer the latest main HEAD; refusing deploy." >&2
            exit 1
          fi

          site_dir="$RUNNER_TEMP/dotchi-public-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CI=true "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy "$site_dir" \
            --project-name=dotchi-ikebukuro-staging \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
