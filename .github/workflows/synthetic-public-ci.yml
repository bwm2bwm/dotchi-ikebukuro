name: Synthetic public site CI

on:
  workflow_dispatch:
    inputs:
      publish_staging:
        description: "Continue past local validation into the pages-staging approval gate and release-managed deploy."
        required: true
        type: boolean
        default: false
      allow_initial_legacy_migration:
        description: "Allow one-time legacy 17-file migration when manifest is HTTP 404 or its HTML exactly matches root index.html (Pages SPA fallback)."
        required: true
        type: boolean
        default: false
      service_date:
        description: "Optional synthetic service-date anchor (YYYY-MM-DD); blank uses the current JST date."
        required: false
        type: string
      expected_previous_release_id:
        description: "Optional expected current r1 releaseId. Required for release-managed publishing; omit only for explicit initial legacy migration."
        required: false
        type: string

permissions:
  contents: read

# One writer lane for this Pages project, independent of dispatch ref.
concurrency:
  group: dotchi-ikebukuro-staging-publish
  cancel-in-progress: false

jobs:
  main-branch-guard:
    name: Require main branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Synthetic public CI may only run from refs/heads/main." >&2
          exit 1
      - name: Confirm allowed ref
        if: github.ref == 'refs/heads/main'
        run: echo "Running from refs/heads/main."

  build:
    name: Build release-managed synthetic site
    needs: main-branch-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_ARTIFACT_NAME: synthetic-release-managed-site-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.upload_site.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_site.outputs.artifact-digest }}
      release_id: ${{ steps.compare_release.outputs.release_id }}
      service_date_anchor: ${{ steps.build_inputs.outputs.service_date_anchor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Validate build inputs and resolve service-date anchor
        id: build_inputs
        env:
          SERVICE_DATE_INPUT: ${{ inputs.service_date }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ inputs.expected_previous_release_id }}
          PUBLISH_STAGING: ${{ inputs.publish_staging }}
          ALLOW_INITIAL_LEGACY_MIGRATION: ${{ inputs.allow_initial_legacy_migration }}
        shell: bash
        run: |
          input_args=(
            --service-date "$SERVICE_DATE_INPUT"
            --expected-previous-release-id "$EXPECTED_PREVIOUS_RELEASE_ID"
          )
          if [[ "$PUBLISH_STAGING" == "true" ]]; then
            input_args+=(--publish-staging)
          fi
          if [[ "$ALLOW_INITIAL_LEGACY_MIGRATION" == "true" ]]; then
            input_args+=(--allow-initial-legacy-migration)
          fi
          input_result="$(python3 -B scripts/validate_release_build_inputs.py "${input_args[@]}")"
          service_date_anchor="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["service_date_anchor"])' "$input_result")"
          [[ "$service_date_anchor" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "service_date_anchor=$service_date_anchor" >> "$GITHUB_OUTPUT"

      - name: Generate synthetic fixtures
        run: >-
          python3 -B scripts/generate_synthetic_public_fixtures.py
          --service-date "${{ steps.build_inputs.outputs.service_date_anchor }}"
          --output "$RUNNER_TEMP/dotchi-public-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Build release-managed public site
        run: >-
          python3 -B scripts/build_public_site.py
          --fixtures "$RUNNER_TEMP/dotchi-public-fixtures-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output "$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --release-managed

      - name: Compare built release with expected A
        id: compare_release
        env:
          SERVICE_DATE_ANCHOR: ${{ steps.build_inputs.outputs.service_date_anchor }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ inputs.expected_previous_release_id }}
          PUBLISH_STAGING: ${{ inputs.publish_staging }}
          ALLOW_INITIAL_LEGACY_MIGRATION: ${{ inputs.allow_initial_legacy_migration }}
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseId"])' "$site_dir/manifest.json")"
          input_args=(
            --service-date "$SERVICE_DATE_ANCHOR"
            --expected-previous-release-id "$EXPECTED_PREVIOUS_RELEASE_ID"
            --built-release-id "$release_id"
          )
          if [[ "$PUBLISH_STAGING" == "true" ]]; then
            input_args+=(--publish-staging)
          fi
          if [[ "$ALLOW_INITIAL_LEGACY_MIGRATION" == "true" ]]; then
            input_args+=(--allow-initial-legacy-migration)
          fi
          comparison="$(python3 -B scripts/validate_release_build_inputs.py "${input_args[@]}")"
          comparison_status="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ab_comparison"])' "$comparison")"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "B releaseId comparison: $comparison_status"

      - name: Confirm release-managed artifact file count
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          file_count="$(find "$site_dir" -type f | wc -l | tr -d '[:space:]')"
          echo "Release-managed artifact files: $file_count (expected 18)"
          test "$file_count" = "18"

      - name: Upload release-managed artifact
        id: upload_site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/dotchi-release-site-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 3

      - name: Confirm artifact identity is available
        env:
          ARTIFACT_ID: ${{ steps.upload_site.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_site.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

  validate:
    name: Independently validate release-managed artifact
    needs:
      - main-branch-guard
      - build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
      tree_digest: ${{ steps.artifact_integrity.outputs.tree_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/dotchi-release-site-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate downloaded release-managed artifact
        id: validate_release
        run: >-
          python3 -B scripts/validate_public_artifact.py --release-managed
          "$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Hash validated artifact tree
        id: artifact_integrity
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tree_digest="$(cd "$site_dir" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]]
          echo "tree_digest=$tree_digest" >> "$GITHUB_OUTPUT"
          echo "Validated release-managed tree SHA-256: $tree_digest"

      - name: Record B prevalidation summary
        env:
          DISPATCH_SERVICE_DATE: ${{ inputs.service_date }}
          DISPATCH_PUBLISH_STAGING: ${{ inputs.publish_staging }}
          DISPATCH_ALLOW_INITIAL_LEGACY_MIGRATION: ${{ inputs.allow_initial_legacy_migration }}
          DISPATCH_EXPECTED_PREVIOUS_RELEASE_ID: ${{ inputs.expected_previous_release_id }}
          SERVICE_DATE_ANCHOR: ${{ needs.build.outputs.service_date_anchor }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ inputs.expected_previous_release_id }}
          BUILT_RELEASE_ID: ${{ needs.build.outputs.release_id }}
        shell: bash
        run: |
          [[ "$SERVICE_DATE_ANCHOR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$BUILT_RELEASE_ID" =~ ^r1-[0-9a-f]{64}$ ]]
          if [[ -n "$EXPECTED_PREVIOUS_RELEASE_ID" ]]; then
            [[ "$EXPECTED_PREVIOUS_RELEASE_ID" =~ ^r1-[0-9a-f]{64}$ ]]
            test "$BUILT_RELEASE_ID" != "$EXPECTED_PREVIOUS_RELEASE_ID"
            comparison="different (B != A)"
          else
            comparison="not requested (no expected A supplied)"
          fi
          {
            echo "## Release-managed B prevalidation"
            echo
            printf -- '- dispatch service_date: `%s`\n' "${DISPATCH_SERVICE_DATE:-empty}"
            printf -- '- dispatch publish_staging: `%s`\n' "$DISPATCH_PUBLISH_STAGING"
            printf -- '- dispatch allow_initial_legacy_migration: `%s`\n' "$DISPATCH_ALLOW_INITIAL_LEGACY_MIGRATION"
            printf -- '- dispatch expected_previous_release_id: `%s`\n' "${DISPATCH_EXPECTED_PREVIOUS_RELEASE_ID:-empty}"
            printf -- '- service-date anchor: `%s`\n' "$SERVICE_DATE_ANCHOR"
            printf -- '- expected A releaseId: `%s`\n' "${EXPECTED_PREVIOUS_RELEASE_ID:-not supplied}"
            printf -- '- built B releaseId: `%s`\n' "$BUILT_RELEASE_ID"
            printf -- '- A/B comparison: **%s**\n' "$comparison"
            echo '- independent validator: **PASS** (18 files / 8 stations)'
          } >> "$GITHUB_STEP_SUMMARY"

  release-and-deploy:
    name: Assemble and deploy release-managed staging site
    needs:
      - main-branch-guard
      - build
      - validate
    if: github.ref == 'refs/heads/main' && inputs.publish_staging == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: pages-staging
    env:
      WRANGLER_VERSION: '4.152.0'
      STAGING_ALIAS: https://dotchi-ikebukuro-staging.pages.dev
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Confirm validated artifact identity
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact_digest }}
          VALIDATED_TREE_DIGEST: ${{ needs.validate.outputs.tree_digest }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$VALIDATED_TREE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$ARTIFACT_ID" = "$BUILD_ARTIFACT_ID"
          test "$ARTIFACT_DIGEST" = "$BUILD_ARTIFACT_DIGEST"

      - name: Download validated artifact by immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/dotchi-release-site-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compare downloaded artifact with validated tree
        env:
          EXPECTED_TREE_DIGEST: ${{ needs.validate.outputs.tree_digest }}
        shell: bash
        run: |
          new_release_dir="$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -d "$new_release_dir"
          tree_digest="$(cd "$new_release_dir" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$tree_digest" = "$EXPECTED_TREE_DIGEST"
          echo "Deploy input matches the independently validated artifact tree."

      - name: Revalidate new release artifact
        run: >-
          python3 -B scripts/validate_public_artifact.py --release-managed
          "$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Fetch and validate current Production alias snapshot
        id: fetch_previous
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ALLOW_INITIAL_LEGACY_MIGRATION: ${{ inputs.allow_initial_legacy_migration }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ inputs.expected_previous_release_id }}
        shell: bash
        run: |
          previous_site_dir="$RUNNER_TEMP/dotchi-previous-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fetch_args=(fetch --base-url "$STAGING_ALIAS" --output "$previous_site_dir")
          if [[ "$ALLOW_INITIAL_LEGACY_MIGRATION" == "true" ]]; then
            fetch_args+=(--allow-initial-legacy-migration)
          fi
          fetch_result="$(python3 -B scripts/fetch_production_artifact.py "${fetch_args[@]}")"
          snapshot_mode="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["mode"])' "$fetch_result")"
          snapshot_fingerprint="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["fingerprint"])' "$fetch_result")"
          snapshot_release_id="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("release_id") or "")' "$fetch_result")"
          [[ "$snapshot_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$snapshot_mode" == "release-managed" || "$snapshot_mode" == "legacy" ]]
          if [[ -n "$EXPECTED_PREVIOUS_RELEASE_ID" ]]; then
            [[ "$EXPECTED_PREVIOUS_RELEASE_ID" =~ ^r1-[0-9a-f]{64}$ ]]
            [[ "$snapshot_mode" == "release-managed" ]]
            test "$snapshot_release_id" = "$EXPECTED_PREVIOUS_RELEASE_ID"
            echo "Fetched Production current release matches expected A."
          else
            [[ "$ALLOW_INITIAL_LEGACY_MIGRATION" == "true" ]]
            [[ "$snapshot_mode" == "legacy" ]]
            echo "Fetched Production snapshot is eligible for explicit initial legacy migration."
          fi
          {
            echo "mode=$snapshot_mode"
            echo "fingerprint=$snapshot_fingerprint"
            echo "release_id=$snapshot_release_id"
          } >> "$GITHUB_OUTPUT"
          echo "Previous Production alias snapshot fetched and independently validated (mode=$snapshot_mode, release_id=${snapshot_release_id:-legacy})."

      - name: Assemble previous generations with new release
        shell: bash
        run: |
          new_release_dir="$RUNNER_TEMP/dotchi-release-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          previous_site_dir="$RUNNER_TEMP/dotchi-previous-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          assembled_site_dir="$RUNNER_TEMP/dotchi-assembled-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evaluated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 -B scripts/assemble_public_release.py \
            --previous "$previous_site_dir" \
            --new-release "$new_release_dir" \
            --as-of "$evaluated_at" \
            --output "$assembled_site_dir"

      - name: Independently validate complete assembled artifact
        run: >-
          python3 -B scripts/validate_public_artifact.py --release-managed
          "$RUNNER_TEMP/dotchi-assembled-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Confirm Cloudflare credentials are configured without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not available to pages-staging." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not available to pages-staging." >&2
            exit 1
          fi
          echo "Cloudflare deploy credential variables are present; values are hidden."

      - name: Install pinned Wrangler
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-package-lock "wrangler@$WRANGLER_VERSION"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" --version

      - name: Confirm existing staging project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          diagnostic_dir="$(mktemp -d "$RUNNER_TEMP/wrangler-project-list.XXXXXX")"
          stdout_file="$diagnostic_dir/stdout.txt"
          stderr_file="$diagnostic_dir/stderr.txt"
          trap 'rm -f "$stdout_file" "$stderr_file"; rmdir "$diagnostic_dir"' EXIT

          if CI=true "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages project list --json >"$stdout_file" 2>"$stderr_file"; then
            wrangler_status=0
          else
            wrangler_status=$?
          fi

          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          node scripts/diagnose_wrangler_project_list.mjs \
            --wrangler-exit-code "$wrangler_status" \
            --stdout-file "$stdout_file" \
            --stderr-file "$stderr_file" \
            --expected-project dotchi-ikebukuro-staging

      - name: Verify selected main commit is still current
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          latest_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$latest_main" != "$GITHUB_SHA" ]]; then
            echo "Selected commit is no longer the latest main HEAD; refusing deploy." >&2
            exit 1
          fi

      - name: Recheck Production alias fingerprint immediately before upload
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_MODE: ${{ steps.fetch_previous.outputs.mode }}
          EXPECTED_FINGERPRINT: ${{ steps.fetch_previous.outputs.fingerprint }}
          ALLOW_INITIAL_LEGACY_MIGRATION: ${{ inputs.allow_initial_legacy_migration }}
        shell: bash
        run: |
          fingerprint_args=(fingerprint --base-url "$STAGING_ALIAS" --mode "$EXPECTED_MODE" --expected-sha256 "$EXPECTED_FINGERPRINT")
          if [[ "$EXPECTED_MODE" == "legacy" && "$ALLOW_INITIAL_LEGACY_MIGRATION" == "true" ]]; then
            fingerprint_args+=(--allow-initial-legacy-migration)
          fi
          verification="$(python3 -B scripts/fetch_production_artifact.py "${fingerprint_args[@]}")"
          test -n "$verification"
          echo "Production alias fingerprint is unchanged since assembly."

      - name: Record approved release preflight summary
        env:
          SERVICE_DATE_ANCHOR: ${{ needs.build.outputs.service_date_anchor }}
          EXPECTED_PREVIOUS_RELEASE_ID: ${{ inputs.expected_previous_release_id }}
          BUILT_RELEASE_ID: ${{ needs.build.outputs.release_id }}
          SNAPSHOT_RELEASE_ID: ${{ steps.fetch_previous.outputs.release_id }}
        shell: bash
        run: |
          [[ "$SERVICE_DATE_ANCHOR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$BUILT_RELEASE_ID" =~ ^r1-[0-9a-f]{64}$ ]]
          if [[ -n "$EXPECTED_PREVIOUS_RELEASE_ID" ]]; then
            [[ "$EXPECTED_PREVIOUS_RELEASE_ID" =~ ^r1-[0-9a-f]{64}$ ]]
            test "$BUILT_RELEASE_ID" != "$EXPECTED_PREVIOUS_RELEASE_ID"
            test "$SNAPSHOT_RELEASE_ID" = "$EXPECTED_PREVIOUS_RELEASE_ID"
            production_check="PASS (current A matched)"
            comparison="PASS (B != A)"
          else
            production_check="PASS (explicit initial legacy migration)"
            comparison="not applicable"
          fi
          {
            echo "## Approved release preflight"
            echo
            printf -- '- service-date anchor: `%s`\n' "$SERVICE_DATE_ANCHOR"
            printf -- '- expected A releaseId: `%s`\n' "${EXPECTED_PREVIOUS_RELEASE_ID:-not supplied}"
            printf -- '- built B releaseId: `%s`\n' "$BUILT_RELEASE_ID"
            printf -- '- A/B comparison: **%s**\n' "$comparison"
            printf -- '- Production snapshot: **%s**\n' "$production_check"
            echo '- assembled artifact independent validator: **PASS**'
            echo '- Production fingerprint recheck: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Direct Upload assembled artifact to Cloudflare Pages staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          CI=true "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy
          "$RUNNER_TEMP/dotchi-assembled-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --project-name=dotchi-ikebukuro-staging
          --branch=main
          --commit-hash="$GITHUB_SHA"
