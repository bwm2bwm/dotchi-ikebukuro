<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f4">
  <title>どっちに池袋 — ローカル実ダイヤpreview</title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.js"></script>
</head>
<body>
  <main>
    <header class="top"><div><h1>どっちに池袋</h1><p>池袋 → 氷川台</p></div><time id="clock">--:--:--</time></header>
    <p class="local-note">ローカル実ダイヤpreview。表示は保存済みデータに基づきます。</p>
    <div id="timetable-status" class="status" role="status" aria-live="polite">時刻表を読み込んでいます…</div>
    <section class="controls" aria-label="列車表示設定">
      <label><input id="direct-only" type="checkbox"> 直通のみ</label>
      <div class="toggle" role="group" aria-label="表示順">
        <button id="mode-line" type="button" aria-pressed="true">路線別</button>
        <button id="mode-departure" type="button" aria-pressed="false">発車順</button>
      </div>
    </section>
    <section id="board" aria-live="off"><p class="empty">読み込み中…</p></section>
    <footer>有効期間外・必要な運行日データ不足・読込エラー時は列車を表示しません。</footer>
  </main>
</body>
</html>
